<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGRIS — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060a;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--red:#ef4444;--red-glow:rgba(239,68,68,0.3);--text:#e0e0e0;--text-muted:rgba(255,255,255,0.5);--glass:rgba(255,255,255,0.04)}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}
.sidebar{width:72px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;flex-shrink:0}
.sidebar .logo{width:40px;height:40px;background:var(--red);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;margin-bottom:16px;box-shadow:0 0 20px var(--red-glow)}
.sidebar a{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);text-decoration:none;font-size:20px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{background:var(--glass);color:#fff}
.sidebar a.active{color:var(--red)}
.sidebar .spacer{flex:1}

.main{flex:1;overflow-y:auto;padding:32px;display:flex;flex-direction:column;gap:20px}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:24px;color:#fff}
.btn{padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:#dc2626;box-shadow:0 0 16px var(--red-glow)}

.filters{display:flex;gap:10px;flex-wrap:wrap}
.filter-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--glass);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--red);color:#fff}
.filter-select{background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text-muted);font-size:12px;outline:none}
.filter-select option{background:#16161c;color:#fff}

/* Masonry grid */
.gallery-grid{columns:3;column-gap:16px}
@media(max-width:1024px){.gallery-grid{columns:2}}
@media(max-width:600px){.gallery-grid{columns:1}}
.gallery-item{break-inside:avoid;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.gallery-item:hover{border-color:rgba(239,68,68,0.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.gallery-item img,.gallery-item video{width:100%;display:block}
.gallery-meta{padding:12px 14px}
.gallery-meta .prompt{font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gallery-meta .info{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--text-muted)}
.gallery-meta .model{color:var(--red);font-weight:600}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:80px 0}
.empty-state .icon{font-size:64px;opacity:0.3}
.empty-state h2{font-size:20px;color:#fff}
.empty-state p{color:var(--text-muted);max-width:360px;font-size:14px;line-height:1.6}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000;padding:40px}
.lightbox.open{display:flex}
.lightbox-content{max-width:90vw;max-height:85vh;position:relative}
.lightbox-content img,.lightbox-content video{max-width:100%;max-height:75vh;border-radius:12px;display:block}
.lightbox-info{background:rgba(20,20,28,0.9);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.lightbox-info h3{font-size:14px;color:#fff;margin-bottom:6px}
.lightbox-info p{font-size:12px;color:var(--text-muted);line-height:1.6}
.lightbox-info .tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.lightbox-info .tag{padding:3px 10px;border-radius:6px;background:var(--glass);border:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.lightbox-close{position:absolute;top:-12px;right:-12px;width:36px;height:36px;border-radius:50%;background:rgba(20,20,28,0.9);border:1px solid var(--border);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-actions{display:flex;gap:8px;margin-top:12px}
.lb-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--glass);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .2s;text-decoration:none}
.lb-btn:hover{border-color:var(--red);color:#fff}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="logo">IG</div>
  <a href="index.html" title="Chat">💬</a>
  <a href="settings.html" title="Settings">⚙️</a>
  <a href="avatar.html" title="Avatar">🗡️</a>
  <a href="gallery.html" class="active" title="Gallery">🖼️</a>
  <a href="dashboard.html" title="Dashboard">📊</a>
  <a href="focus.html" title="Focus">⏱️</a>
  <span class="spacer"></span>
</nav>

<div class="main">
  <div class="page-header">
    <h1>🖼️ Gallery</h1>
    <button class="btn btn-primary" onclick="generateNew()">✨ Generate New</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filter('all',this)">All</button>
    <button class="filter-btn" onclick="filter('image',this)">🖼 Images</button>
    <button class="filter-btn" onclick="filter('video',this)">🎬 Videos</button>
    <select class="filter-select" id="modelFilter" onchange="applyFilters()">
      <option value="">All Models</option>
      <option value="dall-e-3">DALL·E 3</option>
      <option value="stable-diffusion">Stable Diffusion</option>
      <option value="midjourney">Midjourney</option>
      <option value="replicate">Replicate</option>
    </select>
    <select class="filter-select" id="dateFilter" onchange="applyFilters()">
      <option value="">Any Time</option>
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
    </select>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>

  <div class="empty-state" id="emptyState">
    <div class="icon">🎨</div>
    <h2>No media generated yet</h2>
    <p>Ask Igris to create something! Try "Generate an image of a dark knight in a moonlit castle"</p>
    <button class="btn btn-primary" onclick="generateNew()">✨ Ask Igris to Create</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<script>
let items=JSON.parse(localStorage.getItem('igris_gallery')||'[]');
let activeFilter='all';

// Demo data if empty
if(!items.length){
  items=[
    {id:1,type:'image',url:'https://picsum.photos/seed/igris1/600/400',prompt:'A dark knight standing in a moonlit castle courtyard',model:'stable-diffusion',date:'2025-02-20T10:30:00Z',width:600,height:400},
    {id:2,type:'image',url:'https://picsum.photos/seed/igris2/500/700',prompt:'Shadow soldiers rising from the ground with red eyes',model:'dall-e-3',date:'2025-02-20T14:15:00Z',width:500,height:700},
    {id:3,type:'image',url:'https://picsum.photos/seed/igris3/800/450',prompt:'Epic battlefield with dark energy and floating swords',model:'midjourney',date:'2025-02-19T08:00:00Z',width:800,height:450},
    {id:4,type:'image',url:'https://picsum.photos/seed/igris4/600/600',prompt:'Red glowing armor set in a dark forge',model:'stable-diffusion',date:'2025-02-19T16:45:00Z',width:600,height:600},
    {id:5,type:'image',url:'https://picsum.photos/seed/igris5/700/500',prompt:'Igris the red knight bowing before the Shadow Monarch',model:'dall-e-3',date:'2025-02-18T12:00:00Z',width:700,height:500},
    {id:6,type:'image',url:'https://picsum.photos/seed/igris6/500/800',prompt:'Dark throne room with ethereal red light beams',model:'replicate',date:'2025-02-18T09:30:00Z',width:500,height:800}
  ];
}

function render(){
  const grid=document.getElementById('galleryGrid');
  const empty=document.getElementById('emptyState');
  const modelF=document.getElementById('modelFilter').value;
  const dateF=document.getElementById('dateFilter').value;
  let filtered=items;
  if(activeFilter!=='all')filtered=filtered.filter(i=>i.type===activeFilter);
  if(modelF)filtered=filtered.filter(i=>i.model===modelF);
  if(dateF){
    const now=new Date();
    filtered=filtered.filter(i=>{
      const d=new Date(i.date);
      if(dateF==='today')return d.toDateString()===now.toDateString();
      if(dateF==='week'){const w=new Date(now-7*864e5);return d>=w}
      if(dateF==='month'){return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}
      return true;
    });
  }
  if(!filtered.length){grid.innerHTML='';empty.style.display='flex';return}
  empty.style.display='none';
  grid.innerHTML=filtered.map(item=>{
    const date=new Date(item.date).toLocaleDateString();
    const tag=item.type==='video'?`<video src="${item.url}" muted loop></video>`:`<img src="${item.url}" alt="" loading="lazy">`;
    return`<div class="gallery-item" onclick='openLightbox(${JSON.stringify(item).replace(/'/g,"\\'")})'>${tag}<div class="gallery-meta"><div class="prompt">${item.prompt}</div><div class="info"><span class="model">${item.model}</span><span>${date} · ${item.width}×${item.height}</span></div></div></div>`;
  }).join('');
}

function filter(type,btn){
  activeFilter=type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function applyFilters(){render()}

function openLightbox(item){
  const lb=document.getElementById('lightbox');
  const content=document.getElementById('lightboxContent');
  const media=item.type==='video'?`<video src="${item.url}" controls autoplay loop style="max-width:100%;max-height:70vh;border-radius:12px">`:`<img src="${item.url}" alt="">`;
  const date=new Date(item.date).toLocaleString();
  content.innerHTML=`<button class="lightbox-close" onclick="closeLightbox()">✕</button>${media}
    <div class="lightbox-info"><h3>${item.prompt}</h3><div class="tags"><span class="tag">${item.model}</span><span class="tag">${item.width}×${item.height}</span><span class="tag">${date}</span></div>
    <div class="lightbox-actions"><a class="lb-btn" href="${item.url}" download>⬇ Download</a><button class="lb-btn" onclick="closeLightbox();generateNew()">✨ Generate Similar</button></div></div>`;
  lb.classList.add('open');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});

function generateNew(){
  window.location.href='index.html?prefill='+encodeURIComponent('Generate an image of ');
}

render();
</script>
</body>
</html>
